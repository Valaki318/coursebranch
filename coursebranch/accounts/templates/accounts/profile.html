<!DOCTYPE html>
<html>
<head>
    <title>Profile - CourseBranch</title>
</head>
<body>
    <div class="container">
        <a href="{% url 'home' %}" class="back-link">← Back to Home</a>
        
        <h1>Your Profile</h1>
        
        <div class="user-info">
            <p><strong>Username:</strong> {{ user.username }}</p>
            <p><strong>Email:</strong> {{ user.email|default:"Not set" }}</p>
        </div>
        
        {% if messages %}
            {% for message in messages %}
                <div class="success-message">{{ message }}</div>
            {% endfor %}
        {% endif %}
        
        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="major">Major:</label>
                <input type="text" id="major" name="major" value="{{ profile.major }}" placeholder="e.g., Computer Science">
            </div>
            
            <div class="form-group">
                <label for="graduation_year">Graduation Year:</label>
                <input type="number" id="graduation_year" name="graduation_year" value="{{ profile.graduation_year|default:'' }}" placeholder="e.g., 2026">
            </div>
            
            <div class="form-group">
                <label for="bio">Bio:</label>
                <textarea id="bio" name="bio" placeholder="Tell us about yourself...">{{ profile.bio }}</textarea>
            </div>

	    <div class="form-group">
		    <label for="university">University:</label>
		    <select id="university" name="university" onchange="this.form.submit()">
			    <option value="">-- Select University --</option>
			    {% for u in universities %}
			    <option value="{{ u.id }}" 
				    {% if selected_university and u.id == selected_university.id %}selected{% endif %}>
			    {{ u.name }}
			    </option>
			    {% endfor %}
		    </select>
	    </div>

	    <div class="form-group">
		    <label for="college">College:</label>
		    <select id="college" name="college">
			    <option value="">-- Select College --</option>
			    {% for c in colleges %}
			    <option value="{{ c.id }}" {% if profile.college and profile.college.id == c.id %}selected{% endif %}>
			    {{ c.name }}
			    </option>
			    {% endfor %}
		    </select>
	    </div>
            
            <button type="submit">Save Profile</button>
        </form>
    </div>
</body>
</html>
