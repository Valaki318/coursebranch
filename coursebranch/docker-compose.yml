version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=coursebranch
      - POSTGRES_USER=coursebranch_user
      - POSTGRES_PASSWORD=changeme_secure_password
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coursebranch_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: sh -c "python manage.py migrate && gunicorn coursebranch.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=your_secret_key_here_change_in_production
      - DATABASE_URL=postgresql://coursebranch_user:changeme_secure_password@db:5432/coursebranch
      - ALLOWED_HOSTS=localhost,127.0.0.1,your-domain.com
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    ports:
      - "80:80"
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:

