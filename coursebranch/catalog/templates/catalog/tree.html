{% extends 'base.html' %}

{% block title %}Interactive Course Tree - CourseBranch{% endblock %}



{% block content %}
<div style="display: flex; flex-direction: column; gap: 1rem;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1>Course Prerequisite Graph</h1>
        <p style="color: var(--text-muted);">Drag nodes to rearrange. Scroll to zoom. Click to view details.</p>
    </div>

    <iframe src="{% url 'catalog_graph' %}"
        style="width: 100%; height: 80vh; border: 1px solid var(--border-color); border-radius: 1rem; background-color: #111;"></iframe>
</div>
{% endblock %}
